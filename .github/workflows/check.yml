name: Check games and school interface
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check models and controllers
        run: node tests/run.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Check monitor viewports and complete missions
        run: node tests/monitor.cjs
      - name: Check autonomous robot learning and animation
        if: success() || failure()
        run: node tests/robot-gameplay.cjs
      - name: Check real game screens and interactions
        if: success() || failure()
        run: node tests/browser.cjs
      - name: Check reload, inspection and alternative plans
        if: success() || failure()
        run: node tests/session-browser.cjs
      - name: Check repeated clicks, curved roads and saved attempts
        if: success() || failure()
        run: node tests/audit-browser.cjs
      - name: Check map size with browser chrome and desktop zoom
        if: success() || failure()
        run: node tests/map-scale-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-interface-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
