name: Check games and school interface
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check models and controllers
        run: node tests/run.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Check real game screens and interactions
        run: |
          node tests/monitor.cjs
          node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-interface-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
