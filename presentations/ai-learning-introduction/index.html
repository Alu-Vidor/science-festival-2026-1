<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ИИ: данные, обучение и проверка</title><style>html,body{margin:0;background:#fcfbf8;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}main{height:calc(100% - 66px);display:flex;align-items:center;justify-content:center}img{width:100%;height:100%;object-fit:contain;display:block}nav{height:66px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:8px 24px;border-top:1px solid #d6e2dc;color:#233d40;background:#f3f7f1}.controls{display:flex;gap:8px;align-items:center}button,a{background:#fff;color:#233d40;border:1px solid #a6c7b9;border-radius:8px;font:16px Arial,sans-serif;padding:9px 13px;cursor:pointer;text-decoration:none}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #307a71;outline-offset:2px}#counter{min-width:50px;text-align:center;font-size:14px}#downloadPanel{border:1px solid #a6c7b9;border-radius:14px;color:#233d40;background:#fcfbf8;padding:28px;max-width:600px}#downloadPanel::backdrop{background:#233d4070}.files{display:grid;gap:12px}#downloadClose{float:right}.hint{font-size:13px;color:#657b7c}@media(max-width:800px){nav{padding:8px}.hint{display:none}button,a{font-size:13px;padding:9px}}</style></head><body><main><img id="slide" src="slide-01.png" alt="Слайд 1 из 6"></main><nav><button id="downloads">Скачать материалы</button><span class="hint">← → переключить · F полный экран</span><div class="controls"><button id="prev" aria-label="Предыдущий слайд">←</button><span id="counter"></span><button id="next" aria-label="Следующий слайд">→</button><button id="full" aria-label="Полный экран">⛶</button></div></nav><dialog id="downloadPanel"><button id="downloadClose">Закрыть</button><h2>Материалы площадки</h2><div class="files"><a href="ai-learning-introduction.pptx" download>Презентация PowerPoint · 6 слайдов</a><a href="ai-learning-introduction.pdf" download>Презентация PDF</a><a href="facilitator-guide.docx" download>Текст ведущего с действиями · Word</a><a href="facilitator-guide.pdf" download>Текст ведущего · PDF</a><a href="facilitator-guide.txt" download>Текст ведущего · обычный текст</a></div></dialog><script>let n=1;const $=id=>document.getElementById(id);function show(v){n=Math.min(6,Math.max(1,v));$('slide').src='slide-'+String(n).padStart(2,'0')+'.png';$('slide').alt='Слайд '+n+' из 6';$('counter').textContent=n+' / 6';$('prev').disabled=n===1;$('next').disabled=n===6;}$('prev').onclick=()=>show(n-1);$('next').onclick=()=>show(n+1);async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}}$('full').onclick=full;$('downloads').onclick=()=>$('downloadPanel').showModal();$('downloadClose').onclick=()=>$('downloadPanel').close();addEventListener('keydown',e=>{if($('downloadPanel').open)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(n+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(n-1);}if(e.key==='Home')show(1);if(e.key==='End')show(6);if(e.key.toLowerCase()==='f')full();});show(1);</script></body></html>
